name: Salvar palpites diarios

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-picks-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NBA_AUTO_SYNC: '0'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NBA_AUTOMATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Chave diaria do cache
        id: day
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .daily-runtime/data
            .daily-runtime/models
          key: nba-daily-v1-${{ runner.os }}-${{ steps.day.outputs.value }}
          restore-keys: nba-daily-v1-${{ runner.os }}-
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Gerar e preservar antes das partidas
        id: generate
        run: python scripts/generate_daily_archive.py --db .daily-runtime/data/nba.db --output .daily-runtime/report
      - name: Relatorio da execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palpites-${{ steps.day.outputs.value }}-${{ github.run_id }}
          path: .daily-runtime/report
          if-no-files-found: warn
          retention-days: 30
      # Falhas em sequência ficam em uma única issue; ela é fechada na primeira execução bem-sucedida.
      - name: Abrir ou atualizar a issue de falha
        if: failure() && steps.generate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: falha-palpites-diarios
        run: |
          gh label create "$LABEL" --color B60205 --description "Gravacao diaria dos palpites falhou" --force || true
          number=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          body="A execução falhou: $NBA_AUTOMATION_RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Nova falha em sequência. $body"
          else
            gh issue create --label "$LABEL" --title "Falha na gravação diária dos palpites" \
              --body "$body. Veja docs/PALPITES_AUTOMATICOS_GITHUB.md, seção \"Quando a gravação falha\"."
          fi
      - name: Fechar a issue de falha quando voltar ao normal
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: falha-palpites-diarios
        run: |
          for number in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Execução bem-sucedida: $NBA_AUTOMATION_RUN_URL"
          done
