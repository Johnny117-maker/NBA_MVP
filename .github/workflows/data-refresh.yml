name: Atualizar dados publicados

# Coleta os dados, gera o pacote enxuto da versão online e publica no Release "data-latest".
# O app online só baixa o que está no Release; nenhum token vai para ele.
# Agendamento alinhado ao daily-picks.yml (que roda no minuto 17 de cada 2 h): este roda
# no minuto 47 a cada 3 h, depois da captura dos palpites.
on:
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  TAG: data-latest
  WORK: .refresh
  NBA_AUTO_SYNC: '0'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NBA_AUTOMATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      # Fonte única da base: o Release. Se ainda não existir pacote completo (primeira
      # execução ou Release recriado), reconstrói a partir da semente pública, o mesmo
      # caminho que o daily-picks usa quando o cache dele expira.
      - name: Restaurar a base completa do Release
        id: restore
        run: |
          mkdir -p "$WORK/download" "$WORK/home"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$WORK/download" \
               --pattern 'nba-full.tar.gz' --pattern 'nba-full.tar.gz.sha256'; then
            (cd "$WORK/download" && sha256sum -c nba-full.tar.gz.sha256)
            mkdir -p "$WORK/home/data"
            tar -xzf "$WORK/download/nba-full.tar.gz" --no-same-owner -C "$WORK/home/data"
            echo "origem=release" >> "$GITHUB_OUTPUT"
          else
            echo "Sem pacote completo no Release; usando a semente publica."
            mkdir -p "$WORK/home/data"
            python - <<'PY'
          import os
          from pathlib import Path
          from src.daily_automation import bootstrap_seed
          from src.remote_archive import GitHubArchive
          bootstrap_seed(Path(os.environ["WORK"]) / "home" / "data" / "nba.db", GitHubArchive())
          PY
            echo "origem=semente" >> "$GITHUB_OUTPUT"
          fi
          test -f "$WORK/home/data/nba.db"

      - name: Coletar e atualizar
        id: collect
        run: |
          set +e
          python scripts/update_daily.py --db "$WORK/home/data/nba.db"
          code=$?
          echo "codigo=$code" >> "$GITHUB_OUTPUT"
          # 0 = base atualizada; 2 = fonte ainda sem todos os jogos de ontem (publica o que há);
          # 3 = nenhuma fonte respondeu (não publica).
          if [ "$code" -eq 3 ]; then exit 3; fi
          exit 0

      - name: Gerar o pacote enxuto e a base completa
        run: |
          python scripts/build_serving_bundle.py --db "$WORK/home/data/nba.db" \
            --output-dir "$WORK/release" --full-archive "$WORK/release/nba-full.tar.gz"

      # Ordem à prova de corrida: o pacote tem nome com versão, então o manifest.json só
      # passa a apontar para ele depois que o arquivo já está publicado.
      - name: Publicar no Release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --latest=false \
              --title "Dados publicados" \
              --notes "Pacote de dados lido pela versão online. Atualizado automaticamente; não editar."
          serving=$(basename "$WORK"/release/nba-serving-*.tar.gz)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$WORK/release/$serving" "$WORK/release/nba-full.tar.gz" "$WORK/release/nba-full.tar.gz.sha256"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$WORK/release/manifest.json"
          for old in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                         --jq '.assets[].name | select(startswith("nba-serving-"))'); do
            if [ "$old" != "$serving" ]; then
              gh release delete-asset "$TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

      # Falhas em sequência ficam em uma única issue; ela é fechada na primeira execução bem-sucedida.
      - name: Abrir ou atualizar a issue de falha
        if: failure()
        env:
          LABEL: falha-atualizacao-dados
        run: |
          gh label create "$LABEL" --color B60205 --description "Atualizacao dos dados publicados falhou" --force || true
          number=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          body="A execução falhou: $NBA_AUTOMATION_RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Nova falha em sequência. $body"
          else
            gh issue create --label "$LABEL" --title "Falha na atualização dos dados publicados" \
              --body "$body. Veja docs/PUBLICACAO_STREAMLIT.md, seção \"Quando a atualização falha\"."
          fi
      - name: Fechar a issue de falha quando voltar ao normal
        if: success()
        env:
          LABEL: falha-atualizacao-dados
        run: |
          for number in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Execução bem-sucedida: $NBA_AUTOMATION_RUN_URL"
          done
