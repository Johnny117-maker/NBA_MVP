name: Gerar executável Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-desktop.txt -r requirements-dev.txt
      - name: Testar inicialização e persistência
        run: python -m pytest tests/test_desktop.py -q
      - name: Compilar pacote portátil
        run: python scripts/build_desktop.py --no-seed
      - name: Validar bibliotecas, interface e desligamento do executável
        run: python scripts/validate_desktop.py --profile build/desktop-ci-validation
      - name: Disponibilizar pacote Windows
        uses: actions/upload-artifact@v4
        with:
          name: NBAAnalyticsLab-Windows-x64
          path: |
            dist/*-Windows-x64.zip
            dist/*-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 14
