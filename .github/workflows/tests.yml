name: Testes automatizados

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Checagem de tipos Linux (mypy)
        run: python -m mypy --platform linux src pages app.py scripts
      - name: Checagem de tipos Windows (mypy)
        run: python -m mypy --platform win32 src pages app.py scripts
      - name: Executar testes
        run: python -m pytest -q
