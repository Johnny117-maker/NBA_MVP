name: Testes automatizados

on:
  push:
    branches-ignore:
      - codex/daily-archive
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Checagem de tipos Linux (mypy)
        run: python -m mypy --platform linux src pages app.py desktop_launcher.py scripts
      - name: Checagem de tipos Windows (mypy)
        run: python -m mypy --platform win32 src pages app.py desktop_launcher.py scripts
      - name: Executar testes com cobertura
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml
      - name: Guardar o relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
